name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Install from source so the linter binary is built with the same Go
      # toolchain as the project; prebuilt releases can lag behind new Go
      # versions and then refuse to run.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
      - run: golangci-lint run

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      # Findings fail the existing test check; do not make this advisory.
      - name: Check for known vulnerabilities
        run: govulncheck ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # GitHub-hosted runners provide Docker, which the Keycloak
      # testcontainers need.
      - run: go test -tags integration ./...
